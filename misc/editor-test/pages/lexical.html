<!doctype html>
<html><head><meta charset="utf-8"><title>lexical</title></head>
<body>
<div id="ed" contenteditable="true" style="border:1px solid #888;min-height:6em;font-size:20px;padding:6px"></div>
<script src="report.js"></script>
<script type="module">
  import { createEditor, $getRoot } from 'https://esm.sh/lexical@0.52.0';
  import { registerRichText } from 'https://esm.sh/@lexical/rich-text@0.52.0?deps=lexical@0.52.0';
  import { registerHistory, createEmptyHistoryState } from 'https://esm.sh/@lexical/history@0.52.0?deps=lexical@0.52.0';
  const editor = createEditor({ namespace: 't', onError: e => console.error(e) });
  const el = document.getElementById('ed');
  editor.setRootElement(el);
  registerRichText(editor);
  registerHistory(editor, createEmptyHistoryState(), 300);
  el.focus();
  report('lexical', () => editor.getEditorState().read(() => $getRoot().getChildren().map(c => c.getTextContent()).join('|')));
</script>
</body></html>
