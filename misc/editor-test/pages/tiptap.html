<!doctype html>
<html><head><meta charset="utf-8"><title>tiptap</title>
<style>.ProseMirror{border:1px solid #888;min-height:6em;font-size:20px;padding:6px}</style>
</head>
<body>
<div id="ed"></div>
<script src="report.js"></script>
<script type="module">
  import { Editor } from 'https://esm.sh/@tiptap/core@3.32.0';
  import StarterKit from 'https://esm.sh/@tiptap/starter-kit@3.32.0?deps=@tiptap/core@3.32.0';
  const editor = new Editor({ element: document.getElementById('ed'), extensions: [StarterKit], autofocus: true });
  report('tiptap', () => editor.state.doc.content.content.map(n => n.textContent).join('|'));
</script>
</body></html>
