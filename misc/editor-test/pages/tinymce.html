<!doctype html>
<html><head><meta charset="utf-8"><title>tinymce</title></head>
<body>
<textarea id="ed"></textarea>
<script src="https://cdn.jsdelivr.net/npm/tinymce@8.10.0/tinymce.min.js"></script>
<script src="report.js"></script>
<script>
  tinymce.init({
    selector: '#ed',
    license_key: 'gpl',
    base_url: 'https://cdn.jsdelivr.net/npm/tinymce@8.10.0',
    suffix: '.min',
    menubar: false,
    promotion: false,
    height: 300,
    auto_focus: 'ed',
  });
  report('tinymce', () => {
    const e = tinymce.activeEditor;
    if (!e || !e.getBody()) return null;
    return Array.from(e.getBody().children).map(p => p.textContent.replace(/﻿/g, '')).join('|');
  });
</script>
</body></html>
