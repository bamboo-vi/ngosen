<!doctype html>
<html><head><meta charset="utf-8"><title>ckeditor</title>
<link href="https://cdn.jsdelivr.net/npm/ckeditor5@49.0.0/dist/browser/ckeditor5.css" rel="stylesheet">
</head>
<body>
<div id="ed"></div>
<script src="https://cdn.jsdelivr.net/npm/ckeditor5@49.0.0/dist/browser/ckeditor5.umd.js"></script>
<script src="report.js"></script>
<script>
  const { ClassicEditor, Essentials, Paragraph, Bold, Italic } = CKEDITOR;
  let editor = null;
  ClassicEditor.create(document.getElementById('ed'), {
    licenseKey: 'GPL',
    plugins: [Essentials, Paragraph, Bold, Italic],
    toolbar: ['bold', 'italic'],
  }).then(e => { editor = e; e.editing.view.focus(); });
  report('ckeditor', () => {
    if (!editor) return null;
    const root = editor.model.document.getRoot();
    return Array.from(root.getChildren()).map(p => Array.from(p.getChildren()).map(t => t.data || '').join('')).join('|');
  });
</script>
</body></html>
