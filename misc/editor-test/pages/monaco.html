<!doctype html>
<html><head><meta charset="utf-8"><title>monaco</title></head>
<body>
<div id="ed" style="width:900px;height:400px;border:1px solid #888"></div>
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.57.0/min/vs/loader.js"></script>
<script src="report.js"></script>
<script>
  let editor = null;
  require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.57.0/min/vs' } });
  require(['vs/editor/editor.main'], () => {
    editor = monaco.editor.create(document.getElementById('ed'), { value: '', language: 'plaintext', fontSize: 20, minimap: { enabled: false } });
    editor.focus();
  });
  report('monaco', () => (editor ? editor.getValue().split('\n').join('|') : null));
</script>
</body></html>
