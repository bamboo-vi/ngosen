<!doctype html>
<html><head><meta charset="utf-8"><title>codemirror</title>
<style>.cm-editor{border:1px solid #888;height:300px;font-size:20px}</style>
</head>
<body>
<div id="ed"></div>
<script src="report.js"></script>
<script type="module">
  import { EditorView, basicSetup } from 'https://esm.sh/codemirror@6.0.2';
  const view = new EditorView({ doc: '', extensions: [basicSetup], parent: document.getElementById('ed') });
  view.focus();
  report('codemirror', () => view.state.doc.toString().split('\n').join('|'));
</script>
</body></html>
