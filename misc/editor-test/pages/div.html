<!doctype html>
<html><head><meta charset="utf-8"><title>div</title></head>
<body>
<div id="d" contenteditable="true" style="border:1px solid #888;min-height:6em;font-size:20px;padding:6px"></div>
<script src="report.js"></script>
<script>
  const d = document.getElementById('d');
  d.focus();
  report('div', () => d.innerText.replace(/\n+$/, '').split('\n').join('|'));
</script>
</body></html>
