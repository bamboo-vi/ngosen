name: Dev Pre-release

# Republishes the packages of the latest dev branch build under one fixed pre-release, so testers
# have a stable link instead of CI artifacts that need a login and expire after three days.
on:
  workflow_run:
    workflows: ['Test Packaging Build']
    types: [completed]
    branches: [dev]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish the dev-build pre-release
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download the build's packages
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: artifacts/

      - name: Collect release files
        run: packaging/collect-release-files.sh artifacts dist

      # The tag does not match ngosen-*, so it never starts the release workflow.
      - name: Replace the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          sed "s/@SHA@/$SHA/g" packaging/dev-release-notes.md > notes.md
          gh release delete dev-build --cleanup-tag --yes || true
          gh release create dev-build dist/* \
            --prerelease \
            --latest=false \
            --target "$SHA" \
            --title "Ngó Sen bản thử (dev)" \
            --notes-file notes.md
